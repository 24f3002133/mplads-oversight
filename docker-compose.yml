services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "16281:16281"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./SIH_Backend
      dockerfile: ../Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./SIH_Backend/backend:/app/backend
    environment:
      # .env points DATABASE_URL at localhost:16281 for host processes (the
      # scraper). Inside a container localhost is the container itself, so
      # reach Postgres by service name on its internal port instead.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./SIH_Frontend
      dockerfile: ../Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./SIH_Frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  pgdata:
  frontend_node_modules:
